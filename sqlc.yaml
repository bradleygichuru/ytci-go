version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/query/"
    schema: "testdata/migrations/"
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_params_struct_pointers: true

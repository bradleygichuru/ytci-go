# Canonical CloudEvents-shaped recognition contract (ADR 0010).
# The narrative companion is docs/execution/cloudevents.md. Both are one
# contract: this file is the machine-readable form; the doc explains it.
version: 1.0.0
owner: stream:recognition
frozen_at: '2026-11-18'
specversion: '1.0'
envelope:
  required: [specversion, id, source, type, subject, time, data]
  properties:
    specversion: { const: '1.0' }
    id:
      type: string
      format: uuid
      description: UUIDv7 generated by the emitter; also the transport Idempotency-Key.
    source:
      type: string
      pattern: '^ke\.[a-z]+\.[a-z0-9_-]+$'
      description: Emitting module, e.g. ke.events.api.
    type: { type: string }
    subject:
      type: string
      description: Reader subject id. Never a name, email or analytics id.
    time:
      type: string
      format: date-time
      description: Occurrence time (UTC).
    data:
      $ref: '#/payload'
constraints:
  never_in_payload:
    - name
    - email
    - phone
    - county
    - latitude
    - longitude
    - coordinates
    - free_text
    - media_url
    - quiz_answer
    - analytics_id
  unknown_fields: rejected
  client_supplied_sensitivity: rejected

payload:
  type: object
  additionalProperties: false
  required:
    - source_type
    - source_id
    - occurrence_key
    - verification_method
    - verification_result
  properties:
    source_type:
      type: string
      enum: [heritage_site, heritage_trail, county, conservation_activity, challenge, course, event, audio_story, community_story, destination, season]
    source_id: { type: string, maxLength: 128 }
    occurrence_key:
      type: string
      maxLength: 256
      description: Deterministic per subject and occurrence; see occurrence_keys.
    verification_method:
      type: string
      enum: [gps, qr, manual_code, staff_scan, server_recorded, moderation, quiz]
    verification_result:
      type: string
      enum: [verified, attested, moderated, server_recorded, self_declared, rejected]
    sensitivity:
      type: string
      enum: [standard, sensitive, restricted]
    privacy_class:
      type: string
      enum: [private, public, sensitive]
    age_band:
      type: string
      enum: [under_18, 18_plus, unknown]
    program_scope: { type: string, maxLength: 64 }
    consent_version: { type: string, maxLength: 64 }
    occurred_at: { type: string, format: date-time }
    source_revision: { type: integer, minimum: 0 }

occurrence_keys:
  ke.heritage.visit.verified.v1: 'heritage.site:{site_id}'
  ke.heritage.trail.completed.v1: 'heritage.trail:{trail_id}'
  ke.heritage.county.collected.v1: 'heritage.county:{county_gid}'
  ke.conservation.participation.verified.v1: 'conservation.activity:{activity_id}'
  ke.challenge.completed.v1: 'challenge:{challenge_id}'
  ke.course.completed.v1: 'course:{course_id}:{revision}'
  ke.event.attended.v1: 'event.attendance:{event_id}'
  ke.audio.story.completed.v1: 'audio.story:{story_id}'
  ke.community.story.approved.v1: 'community.story:{story_id}'
  ke.explore.destination.progressed.v1: 'explore.destination:{destination_slug}'
  ke.season.completed.v1: 'season:{season_id}'

events:
  - type: ke.heritage.visit.verified.v1
    category: heritage
    subject_type: site
    description: A verified visit to a heritage site.
    xp: 100
    badge: heritage_site_visit
    verification: [gps, qr, manual_code]
    privacy: [private, public, sensitive]
  - type: ke.heritage.trail.completed.v1
    category: heritage
    subject_type: trail
    description: A verified heritage trail completion.
    xp: 250
    badge: heritage_trail_complete
    verification: [gps, qr, manual_code]
    privacy: [private, public, sensitive]
  - type: ke.heritage.county.collected.v1
    category: heritage
    subject_type: county
    description: First verified site in a county.
    xp: 150
    badge: county_collected
    verification: [gps, qr, manual_code]
    privacy: [private, public]
  - type: ke.conservation.participation.verified.v1
    category: conservation
    subject_type: activity
    description: Verified conservation participation.
    xp: 150
    badge: conservation_participant
    verification: [staff_scan, moderation]
    privacy: [private, public]
  - type: ke.challenge.completed.v1
    category: challenge
    subject_type: challenge
    description: A moderated challenge completion.
    xp: [50, 100, 150]
    badge: challenge_complete
    verification: [moderation]
    privacy: [private, public]
  - type: ke.course.completed.v1
    category: course
    subject_type: course
    description: A course completed with a passed quiz; first pass only.
    xp: 150
    badge: course_complete
    verification: [quiz]
    privacy: [private, public]
  - type: ke.event.attended.v1
    category: events
    subject_type: event
    description: A staff or QR verified event check-in. RSVP alone never awards.
    xp: 50
    badge: event_attended
    verification: [qr, staff_scan]
    privacy: [private, public]
  - type: ke.audio.story.completed.v1
    category: audio
    subject_type: story
    description: Server-recorded Audio Story completion; once per story, 5/week cap.
    xp: 25
    badge: audio_story_complete
    verification: [server_recorded]
    privacy: [private]
  - type: ke.community.story.approved.v1
    category: community
    subject_type: story
    description: A moderated community story approval; 3/week cap.
    xp: 50
    badge: community_contributor
    verification: [moderation]
    privacy: [private, public]
  - type: ke.explore.destination.progressed.v1
    category: explore
    subject_type: destination
    description: Private destination progress only; no XP.
    xp: 0
    badge: null
    verification: [self_declared]
    privacy: [private]
  - type: ke.season.completed.v1
    category: season
    subject_type: season
    description: A completed recognition season.
    xp: 500
    badge: season_complete
    verification: [server_recorded]
    privacy: [private, public]

verification:
  awards_xp: [verified, attested, moderated, server_recorded]
  progress_only: [self_declared]
  rejected: never_awards

idempotency:
  delivery: at_least_once
  effect: exactly_once
  transport_key: 'event.id'
  event_uniqueness: [source, id]
  occurrence_uniqueness_scope: [subject, occurrence_key]
  award_uniqueness:
    - [subject_id, rule_key, source_type, source_id]
    - [subject_id, badge_key, source_type, source_id]
  rule_version_in_award_key: false
  award_key_format: '{rule_key}|{subject_id}|{source_type}|{source_id}'
  xp_award_uniqueness: [subject_id, rule_key, source_type, source_id]
  outbox_uniqueness: [event_id, topic]
  concurrency: 'FOR UPDATE SKIP LOCKED'
  write_pattern: 'INSERT ... ON CONFLICT DO NOTHING RETURNING id; update projection only when a row is returned'
  dedupe_window: none

backfill:
  additive_only: true
  rule_version: effective_at_occurred_at
  dry_run_required: true
  second_approver_required: true
  rate_limited_batches: true
  corrections: compensating_entries
  retroactive_grants: forbidden

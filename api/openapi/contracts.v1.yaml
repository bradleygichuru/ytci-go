  # -------------------------------------------------------------------------
  # Platform
  # -------------------------------------------------------------------------
  /v1/public/contracts:
    get:
      tags: [platform]
      operationId: getContractVersions
      summary: Frozen contract versions the client was built against
      security: []
      responses:
        '200':
          description: Contract versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractVersions' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VenueId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SpeciesId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SpeciesSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+$' }
    BadgeKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    EventClass:
      name: eventClass
      in: query
      schema: { type: string, enum: [meeting, incentive, conference, exhibition, community] }
    Format:
      name: format
      in: query
      schema: { type: string, enum: [in_person, online, hybrid] }
    CountyGid:
      name: countyGid
      in: query
      schema: { type: integer, minimum: 1 }
    Journey:
      name: journey
      in: query
      schema:
        type: string
        enum: [onboarding, first_itinerary, event_registration, challenge_submission, conservation_checkin, course_completion, heritage_visit, audio_playback, recognition_optin]
    DateFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    DateTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    AnalyticsId:
      name: analyticsId
      in: query
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Dependency or kill switch unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: EVENT_CAPACITY_FULL }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            requestId: { type: string }
    ValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    Page:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
    Acknowledgement:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: true }
        id: { type: string }
        message: { type: string }
    ContractVersions:
      type: object
      required: [contracts]
      properties:
        contracts:
          type: array
          items:
            type: object
            required: [contract, version]
            properties:
              contract: { type: string }
              version: { type: string }
              frozenAt: { type: string, format: date-time }
              ownerStream: { type: string }

    # -----------------------------------------------------------------------
    # MICE
    # -----------------------------------------------------------------------
    EventSummary:
      type: object
      required: [id, title, eventClass, format, access, status, startsAt, timezone, county]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        eventClass: { type: string, enum: [meeting, incentive, conference, exhibition, community] }
        format: { type: string, enum: [in_person, online, hybrid] }
        access: { type: string, enum: [public, registered, invite_only] }
        status: { type: string, enum: [draft, published, postponed, cancelled, scheduled] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        timezone: { type: string, example: Africa/Nairobi }
        county: { type: string }
        countyGid: { type: integer, nullable: true }
        venue:
          allOf: [{ $ref: '#/components/schemas/VenueRef' }]
          nullable: true
        organizer:
          allOf: [{ $ref: '#/components/schemas/OrganizerRef' }]
          nullable: true
        imageUrl: { type: string, nullable: true }
        capacity: { type: integer, nullable: true }
        seatsRemaining: { type: integer, nullable: true }
        waitlistOpen: { type: boolean }
        registrationMode: { type: string, enum: [rsvp, ticket_handoff, none] }
        price:
          allOf: [{ $ref: '#/components/schemas/Price' }]
          nullable: true
        accessibility:
          $ref: '#/components/schemas/AccessibilitySummary'
        saved: { type: boolean }
    EventWrite:
      type: object
      required: [title, eventClass, format, access, type, eventDate]
      properties:
        title: { type: string, maxLength: 200 }
        organizerProfileId: { type: string, format: uuid, nullable: true }
        venueId: { type: string, format: uuid, nullable: true }
        eventClass: { type: string, enum: [meeting, incentive, conference, exhibition, community] }
        format: { type: string, enum: [in_person, online, hybrid] }
        access: { type: string, enum: [public, registered, invite_only] }
        type: { type: string, description: 'Editorial theme, not the event class' }
        eventDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        startTime: { type: string, example: '09:00' }
        endTime: { type: string, example: '17:00' }
        timezone: { type: string, default: Africa/Nairobi }
        description: { type: string }
        capacity: { type: integer, nullable: true }
        waitlistCapacity: { type: integer, nullable: true }
        registrationMode: { type: string, enum: [rsvp, ticket_handoff, none] }
        priceAmount: { type: number, nullable: true }
        priceCurrency: { type: string, minLength: 3, maxLength: 3, nullable: true }
        salesEnd: { type: string, format: date-time, nullable: true }
        ticketUrl: { type: string, format: uri, nullable: true }
        accessibility: { $ref: '#/components/schemas/AccessibilityWrite' }
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            description: { type: string, nullable: true }
            highlights:
              type: array
              items: { type: string }
            agenda:
              type: array
              items: { $ref: '#/components/schemas/Session' }
            sessionCount: { type: integer }
            speakerCount: { type: integer }
            accessibilityDetail:
              allOf: [{ $ref: '#/components/schemas/AccessibilityBlock' }]
              nullable: true
            venueDetail:
              allOf: [{ $ref: '#/components/schemas/Venue' }]
              nullable: true
            organizerDetail:
              allOf: [{ $ref: '#/components/schemas/OrganizerProfile' }]
              nullable: true
            registrationQuestions:
              type: array
              maxItems: 2
              items: { $ref: '#/components/schemas/RegistrationQuestion' }
            sales:
              allOf: [{ $ref: '#/components/schemas/Sales' }]
              nullable: true
            registration:
              allOf: [{ $ref: '#/components/schemas/Registration' }]
              nullable: true
            notifications:
              type: array
              items: { $ref: '#/components/schemas/EventNotification' }
    VenueRef:
      type: object
      required: [slug, name, county]
      properties:
        slug: { type: string }
        name: { type: string }
        county: { type: string }
        countyGid: { type: integer, nullable: true }
    Venue:
      allOf:
        - $ref: '#/components/schemas/VenueRef'
        - type: object
          properties:
            id: { type: string, format: uuid }
            addressLine1: { type: string, nullable: true }
            addressLine2: { type: string, nullable: true }
            latitude: { type: number, format: double, nullable: true }
            longitude: { type: number, format: double, nullable: true }
            capacityInPerson: { type: integer, nullable: true }
            capacityOnline: { type: integer, nullable: true }
            rooms:
              type: array
              items: { type: string }
            transportNotes: { type: string, nullable: true }
            dropoffNotes: { type: string, nullable: true }
            parkingNotes: { type: string, nullable: true }
            accessibility:
              allOf: [{ $ref: '#/components/schemas/AccessibilityBlock' }]
              nullable: true
            verifiedAt: { type: string, format: date-time, nullable: true }
    VenueWrite:
      type: object
      required: [name, county]
      properties:
        name: { type: string }
        slug: { type: string }
        county: { type: string }
        countyGid: { type: integer, nullable: true }
        addressLine1: { type: string }
        addressLine2: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        capacityInPerson: { type: integer, nullable: true }
        capacityOnline: { type: integer, nullable: true }
        rooms: { type: array, items: { type: string } }
        transportNotes: { type: string }
        dropoffNotes: { type: string }
        parkingNotes: { type: string }
        accessibility: { $ref: '#/components/schemas/AccessibilityWrite' }
    AccessibilitySummary:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [reported, unknown] }
        verifiedAt: { type: string, format: date-time, nullable: true }
        label: { type: string, example: "Reported by the organizer, last verified 2026-11-01" }
    AccessibilityBlock:
      type: object
      required: [reportedBy, verifiedAt, fields]
      properties:
        reportedBy: { type: string }
        verifiedAt: { type: string, format: date-time, nullable: true }
        label: { type: string }
        fields:
          type: object
          required: [stepFreeEntrance, stepFreeRoute, accessibleToilet]
          properties:
            stepFreeEntrance: { type: string, enum: [yes, no, unknown] }
            stepFreeRoute: { type: string, enum: [yes, no, unknown] }
            accessibleToilet: { type: string, enum: [yes, no, unknown] }
            accessibleParking: { type: string, enum: [yes, no, unknown] }
            accessibleSeating: { type: string, enum: [yes, no, unknown] }
            captioning: { type: string, enum: [yes, no, unknown] }
            signLanguage: { type: string, enum: [yes, no, unknown] }
            hearingLoop: { type: string, enum: [yes, no, unknown] }
            quietRoom: { type: string, enum: [yes, no, unknown] }
            assistanceDogs: { type: string, enum: [yes, no, unknown] }
            companionTicketPolicy: { type: string, nullable: true }
            contentNotes: { type: string, nullable: true }
    AccessibilityWrite:
      type: object
      properties:
        stepFreeEntrance: { type: string, enum: [yes, no, unknown] }
        stepFreeRoute: { type: string, enum: [yes, no, unknown] }
        accessibleToilet: { type: string, enum: [yes, no, unknown] }
        accessibleParking: { type: string, enum: [yes, no, unknown] }
        accessibleSeating: { type: string, enum: [yes, no, unknown] }
        captioning: { type: string, enum: [yes, no, unknown] }
        signLanguage: { type: string, enum: [yes, no, unknown] }
        hearingLoop: { type: string, enum: [yes, no, unknown] }
        quietRoom: { type: string, enum: [yes, no, unknown] }
        assistanceDogs: { type: string, enum: [yes, no, unknown] }
        companionTicketPolicy: { type: string }
        contentNotes: { type: string }
    OrganizerRef:
      type: object
      required: [slug, displayName, trustTier, label]
      properties:
        slug: { type: string }
        displayName: { type: string }
        trustTier: { type: string, enum: [programme_partner, verified_organizer, community_organizer] }
        label: { type: string, example: Verified organizer }
    OrganizerProfile:
      allOf:
        - $ref: '#/components/schemas/OrganizerRef'
        - type: object
          properties:
            id: { type: string, format: uuid }
            about: { type: string, nullable: true }
            logoUrl: { type: string, nullable: true }
            contactEmail: { type: string, nullable: true }
            contactPhone: { type: string, nullable: true }
            websiteUrl: { type: string, nullable: true }
            verificationStatus: { type: string, enum: [unverified, pending, verified, expired, revoked] }
            verifiedAt: { type: string, format: date-time, nullable: true }
            verificationExpiresAt: { type: string, format: date-time, nullable: true }
            revokedReason: { type: string, nullable: true }
            upcomingEvents:
              type: array
              items: { $ref: '#/components/schemas/EventSummary' }
            pastEventCount: { type: integer }
    OrganizerWrite:
      type: object
      required: [displayName]
      properties:
        slug: { type: string }
        displayName: { type: string }
        trustTier: { type: string, enum: [programme_partner, verified_organizer, community_organizer] }
        about: { type: string }
        logoUrl: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        websiteUrl: { type: string }
        legalName: { type: string }
        registrationNumber: { type: string }
    OrganizerVerificationDecision:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [verify, reject, revoke, restore, expire, appeal_decide] }
        trustTier: { type: string, enum: [programme_partner, verified_organizer, community_organizer] }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        expiresAt: { type: string, format: date-time, nullable: true }
        evidenceRef: { type: string, nullable: true }
    Session:
      type: object
      required: [id, day, startsAt, endsAt, title]
      properties:
        id: { type: string, format: uuid }
        day: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        room: { type: string, nullable: true }
        track: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        capacity: { type: integer, nullable: true }
        speakers:
          type: array
          items: { $ref: '#/components/schemas/Speaker' }
    SessionWrite:
      type: object
      required: [day, startsAt, endsAt, title]
      properties:
        day: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        room: { type: string }
        track: { type: string }
        title: { type: string }
        description: { type: string }
        capacity: { type: integer, nullable: true }
        displayOrder: { type: integer }
    PersonWrite:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        title: { type: string }
        organization: { type: string }
        bio: { type: string }
        photoUrl: { type: string }
        isPublic: { type: boolean, default: true }
    Speaker:
      type: object
      required: [displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        title: { type: string, nullable: true }
        organization: { type: string, nullable: true }
        role: { type: string, enum: [speaker, moderator, panelist, host] }
        photoUrl: { type: string, nullable: true }
    Price:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, format: double, example: 2500 }
        currency: { type: string, minLength: 3, maxLength: 3, example: KES }
        display: { type: string, example: "KES 2,500" }
    Sales:
      type: object
      required: [status, ticketUrl, soldBy]
      properties:
        status: { type: string, enum: [on_sale, sold_out, ended, not_on_sale] }
        ticketUrl: { type: string, format: uri }
        soldBy: { type: string, example: Organizer name }
        salesEnd: { type: string, format: date-time, nullable: true }
        disclosure: { type: string, example: YTCI does not process payment. }
    RegistrationQuestion:
      type: object
      required: [id, promptEn, answerKind]
      properties:
        id: { type: string, format: uuid }
        promptEn: { type: string }
        promptSw: { type: string, nullable: true }
        answerKind: { type: string, enum: [short_text, single_choice, boolean] }
        choices: { type: array, items: { type: string } }
        required: { type: boolean }
    RegistrationRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: { type: string }
        reminderOffsetMinutes: { type: integer, nullable: true, enum: [60, 1440, 10080] }
        acceptWaitlist: { type: boolean, default: true }
    Registration:
      type: object
      required: [id, eventId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [confirmed, waitlisted, cancelled, checked_in] }
        answers: { type: object, additionalProperties: { type: string } }
        reminderOffsetMinutes: { type: integer, nullable: true }
        waitlistPosition: { type: integer, nullable: true }
        confirmBy: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        ticket:
          allOf: [{ $ref: '#/components/schemas/Ticket' }]
          nullable: true
        checkIn:
          allOf: [{ $ref: '#/components/schemas/CheckIn' }]
          nullable: true
        event:
          allOf: [{ $ref: '#/components/schemas/EventSummary' }]
          nullable: true
    AdminRegistration:
      allOf:
        - $ref: '#/components/schemas/Registration'
        - type: object
          properties:
            attendee:
              type: object
              properties:
                displayName: { type: string }
                email: { type: string }
            answersSummary: { type: string, nullable: true }
    TicketHandoff:
      type: object
      required: [id, eventId, createdAt, ticketUrl, soldBy]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        price: { $ref: '#/components/schemas/Price' }
        ticketUrl: { type: string, format: uri }
        soldBy: { type: string, example: Swahili Coast Trust }
        disclosure: { type: string, example: YTCI does not process payment. }
    Ticket:
      type: object
      required: [id, registrationId, qrPayload, issuedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        qrPayload: { type: string, description: Opaque signed token; never a raw registration id }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        state: { type: string, enum: [valid, checked_in, expired, revoked, event_ended] }
    CheckInRequest:
      type: object
      properties:
        qrPayload: { type: string }
        registrationId: { type: string, format: uuid }
        method: { type: string, enum: [qr, manual, staff_override] }
        overrideReason: { type: string, maxLength: 500 }
        deviceId: { type: string }
        clientTs: { type: string, format: date-time }
      oneOf:
        - required: [qrPayload]
        - required: [registrationId]
    CheckIn:
      type: object
      required: [id, registrationId, eventId, checkedInAt, method]
      properties:
        id: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        checkedInAt: { type: string, format: date-time }
        method: { type: string, enum: [qr, manual, offline_queue, staff_override] }
        staffRef: { type: string, nullable: true }
        attendeeName: { type: string, nullable: true, description: Staff scanner only }
        duplicate: { type: boolean }
    CheckInScan:
      type: object
      required: [clientScanId, qrPayload, clientTs]
      properties:
        clientScanId: { type: string }
        qrPayload: { type: string }
        clientTs: { type: string, format: date-time }
    CheckInScanBatch:
      type: object
      required: [deviceId, scans]
      properties:
        deviceId: { type: string }
        scans:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CheckInScan' }
    CheckInScanResult:
      type: object
      required: [clientScanId, status]
      properties:
        clientScanId: { type: string }
        status: { type: string, enum: [applied, duplicate, rejected] }
        reason: { type: string, nullable: true }
        checkIn:
          allOf: [{ $ref: '#/components/schemas/CheckIn' }]
          nullable: true
    CheckInScanBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/CheckInScanResult' }
        applied: { type: integer }
        duplicates: { type: integer }
        rejected: { type: integer }
    EventReportRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [impersonation, safety_concern, inaccurate_information, spam, payment_issue, accessibility_misrepresentation] }
        details: { type: string, maxLength: 2000 }
        organizerSlug: { type: string, nullable: true }
    EventReport:
      type: object
      required: [id, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid, nullable: true }
        organizerId: { type: string, format: uuid, nullable: true }
        reason: { type: string, enum: [impersonation, safety_concern, inaccurate_information, spam, payment_issue, accessibility_misrepresentation] }
        details: { type: string, nullable: true }
        status: { type: string, enum: [open, triaged, resolved, dismissed] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    EventNotification:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [reminder, change_notice, waitlist_promotion] }
        status: { type: string, enum: [queued, sent, skipped, failed, read] }
        eventVersion: { type: integer }
        title: { type: string }
        body: { type: string }
        deepLink: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    ChangeNoticeWrite:
      type: object
      required: [materialFields, copyEn, copySw]
      properties:
        materialFields:
          type: array
          items: { type: string, enum: [date_time, venue, status, capacity, session] }
        copyEn: { type: string }
        copySw: { type: string }
        previewOnly: { type: boolean, default: true }
    ChangeNotice:
      type: object
      required: [id, eventId, status, materialFields, copyEn]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        fromVersion: { type: integer }
        toVersion: { type: integer }
        materialFields: { type: array, items: { type: string } }
        copyEn: { type: string }
        copySw: { type: string, nullable: true }
        status: { type: string, enum: [draft, approved, sent, cancelled] }
        recipientCount: { type: integer }
    OrganizerVerificationItem:
      allOf:
        - $ref: '#/components/schemas/OrganizerProfile'
        - type: object
          properties:
            evidence:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string }
                  uploadedAt: { type: string, format: date-time }
                  reviewed: { type: boolean }

    # -----------------------------------------------------------------------
    # Recognition
    # -----------------------------------------------------------------------
    Level:
      type: object
      required: [value, name, threshold]
      properties:
        value: { type: integer }
        name: { type: string }
        threshold: { type: integer }
        nextName: { type: string, nullable: true }
        xpIntoLevel: { type: integer }
        xpToNext: { type: integer, nullable: true }
    XpEntry:
      type: object
      required: [id, amount, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer }
        reason: { type: string, enum: [award, adjustment, reversal] }
        sourceType: { type: string }
        sourceId: { type: string }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    BadgeDefinition:
      type: object
      required: [badgeKey, nameEn, family, privacyClass, status]
      properties:
        badgeKey: { type: string }
        nameEn: { type: string }
        nameSw: { type: string, nullable: true }
        family: { type: string }
        criteria: { type: object, additionalProperties: true }
        iconKey: { type: string, nullable: true }
        colourToken: { type: string, nullable: true }
        privacyClass: { type: string, enum: [private, public, sensitive] }
        hidden: { type: boolean }
        publicEligible: { type: boolean }
        status: { type: string, enum: [draft, published, retired] }
        version: { type: integer }
    BadgeAward:
      type: object
      required: [badgeKey, nameEn, earned, privacyClass, hidden]
      properties:
        badgeKey: { type: string }
        nameEn: { type: string }
        nameSw: { type: string, nullable: true }
        family: { type: string }
        criteria: { type: object, additionalProperties: true }
        earned: { type: boolean }
        earnedAt: { type: string, format: date-time, nullable: true }
        hidden: { type: boolean }
        privacyClass: { type: string, enum: [private, public, sensitive] }
        sourceType: { type: string, nullable: true }
        sourceId: { type: string, nullable: true }
        progress:
          type: object
          nullable: true
          properties:
            current: { type: integer }
            target: { type: integer }
    Mission:
      type: object
      required: [trackKey, nameEn, family, current, target, completed]
      properties:
        trackKey: { type: string }
        nameEn: { type: string }
        nameSw: { type: string, nullable: true }
        family: { type: string, enum: [trail, county_collection, course_path, mission] }
        current: { type: integer }
        target: { type: integer }
        completed: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        xpReward: { type: integer }
        badgeKey: { type: string, nullable: true }
    Season:
      type: object
      required: [key, nameEn, startsAt, endsAt, status]
      properties:
        key: { type: string }
        nameEn: { type: string }
        nameSw: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [upcoming, active, frozen, closed] }
        badgeKey: { type: string, nullable: true }
        xpAward: { type: integer }
        missionFamilies:
          type: array
          items: { type: string }
    SeasonProgress:
      allOf:
        - $ref: '#/components/schemas/Season'
        - type: object
          properties:
            progress:
              type: object
              properties:
                xp: { type: integer }
                missionsCompleted: { type: integer }
                missionsTotal: { type: integer }
                badgeEarned: { type: boolean }
            optIn: { type: boolean }
    SeasonWrite:
      type: object
      required: [key, nameEn, startsAt, endsAt]
      properties:
        key: { type: string }
        nameEn: { type: string }
        nameSw: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        badgeKey: { type: string, nullable: true }
        xpAward: { type: integer, default: 500 }
        missionFamilies:
          type: array
          items: { type: string }
    RecognitionOverview:
      type: object
      required: [level, totalXp, recentAwards, season, passport]
      properties:
        level: { $ref: '#/components/schemas/Level' }
        totalXp: { type: integer, description: Private to the reader }
        recentAwards:
          type: array
          items: { $ref: '#/components/schemas/BadgeAward' }
        badgeCounts:
          type: object
          properties:
            earned: { type: integer }
            total: { type: integer }
            public: { type: integer }
        season:
          type: object
          nullable: true
          properties:
            key: { type: string }
            nameEn: { type: string }
            endsAt: { type: string, format: date-time }
            progressPercent: { type: integer }
        passport:
          type: object
          properties:
            counties: { type: integer }
            sites: { type: integer }
        leaderboard:
          type: object
          properties:
            optedIn: { type: boolean }
            eligible: { type: boolean }
            reason: { type: string, nullable: true }
        adjustmentNotices:
          type: array
          items: { $ref: '#/components/schemas/XpEntry' }
    Passport:
      type: object
      required: [counties, sites]
      properties:
        counties:
          type: array
          items:
            type: object
            properties:
              countyGid: { type: integer }
              name: { type: string }
              sites: { type: integer }
              complete: { type: boolean }
        sites:
          type: array
          items:
            type: object
            properties:
              siteRef: { type: string }
              name: { type: string }
              countyGid: { type: integer }
              visitedAt: { type: string, format: date-time, nullable: true }
              sensitive: { type: boolean }
    LeaderboardEntry:
      type: object
      required: [rank, displayName, level, publicBadgeCount, verifiedSites, trailCompletions]
      properties:
        rank: { type: integer }
        displayName: { type: string }
        county: { type: string, nullable: true }
        level: { type: integer }
        publicBadgeCount: { type: integer }
        verifiedSites: { type: integer }
        trailCompletions: { type: integer }
        isSelf: { type: boolean }
    Leaderboard:
      type: object
      required: [seasonKey, suppressed, entries]
      properties:
        seasonKey: { type: string }
        countyGid: { type: integer, nullable: true }
        suppressed: { type: boolean }
        suppressionReason: { type: string, nullable: true, example: Not enough participants yet. }
        entries:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LeaderboardEntry' }
        updatedAt: { type: string, format: date-time }
        rankingNote: { type: string }
    LeaderboardState:
      type: object
      required: [seasonKey, optedIn, eligible]
      properties:
        seasonKey: { type: string }
        optedIn: { type: boolean }
        eligible: { type: boolean }
        ineligibleReason: { type: string, nullable: true, enum: [under_18, consent_missing, disabled] }
        displayName:
          allOf: [{ $ref: '#/components/schemas/DisplayName' }]
          nullable: true
        ownEntry:
          allOf: [{ $ref: '#/components/schemas/LeaderboardEntry' }]
          nullable: true
        board:
          allOf: [{ $ref: '#/components/schemas/Leaderboard' }]
          nullable: true
    LeaderboardJoin:
      type: object
      required: [seasonKey, displayName]
      properties:
        seasonKey: { type: string }
        displayName: { type: string, minLength: 2, maxLength: 24 }
        consentVersion: { type: string }
        countyGid: { type: integer, nullable: true }
    DisplayName:
      type: object
      required: [displayName, status]
      properties:
        displayName: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        previousApproved: { type: string, nullable: true }
        nextChangeAllowed: { type: string, format: date-time, nullable: true }
    RecognitionRule:
      type: object
      required: [id, ruleKey, version, sourceType, status, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        ruleKey: { type: string }
        version: { type: integer }
        sourceType: { type: string }
        status: { type: string, enum: [draft, published, retired] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        criteria: { type: object, additionalProperties: true }
        xpAmount: { type: integer }
        badgeKey: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        publishedBy: { type: string, nullable: true }
    RecognitionRuleWrite:
      type: object
      required: [ruleKey, sourceType, xpAmount]
      properties:
        ruleKey: { type: string }
        sourceType: { type: string }
        effectiveFrom: { type: string, format: date-time }
        criteria: { type: object, additionalProperties: true }
        xpAmount: { type: integer, minimum: 0 }
        badgeKey: { type: string, nullable: true }
    RuleSimulation:
      type: object
      required: [ruleKey, version, evaluated, wouldAward, wouldDeduct]
      properties:
        ruleKey: { type: string }
        version: { type: integer }
        evaluated: { type: integer }
        wouldAward: { type: integer }
        wouldDeduct: { type: integer }
        sampleSubjects:
          type: array
          items: { type: string }
        notes: { type: string, nullable: true }
    BadgeDefinitionWrite:
      type: object
      required: [badgeKey, nameEn, nameSw, family, privacyClass]
      properties:
        badgeKey: { type: string }
        nameEn: { type: string }
        nameSw: { type: string }
        family: { type: string }
        criteria: { type: object, additionalProperties: true }
        iconKey: { type: string }
        colourToken: { type: string }
        privacyClass: { type: string, enum: [private, public, sensitive] }
        hidden: { type: boolean }
        publicEligible: { type: boolean }
    ModerationCase:
      type: object
      required: [id, kind, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [display_name, leaderboard_cheat, leaderboard_report, event_report] }
        subjectRef: { type: string, nullable: true }
        reason: { type: string }
        status: { type: string, enum: [open, triaged, decided, appealed, closed] }
        decision: { type: string, nullable: true, enum: [none, warn, disqualify, rename, dismiss, revoke] }
        decidedAt: { type: string, format: date-time, nullable: true }
        appealDeadline: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    BackfillBatch:
      type: object
      required: [id, ruleKey, ruleVersion, status, processed, awarded]
      properties:
        id: { type: string, format: uuid }
        ruleKey: { type: string }
        ruleVersion: { type: integer }
        status: { type: string, enum: [dry_run, approved, running, paused, completed, failed] }
        processed: { type: integer }
        awarded: { type: integer }
        diff:
          type: object
          properties:
            wouldAward: { type: integer }
            wouldSkip: { type: integer }
            conflicts: { type: integer }
        createdBy: { type: string }
        approvedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    KillSwitch:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        reason: { type: string, nullable: true }
        updatedBy: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: { type: string }
        actorRef: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # -----------------------------------------------------------------------
    # Species
    # -----------------------------------------------------------------------
    SpeciesSummary:
      type: object
      required: [slug, scientificName, nameEn]
      properties:
        slug: { type: string }
        scientificName: { type: string }
        nameEn: { type: string }
        nameSw: { type: string, nullable: true }
        iucnCategory: { type: string, nullable: true, enum: [CR, EN, VU, NT, LC, DD, NE] }
        taxonomicStatus: { type: string }
        publicationState: { type: string, enum: [draft, in_review, published, unpublished, tombstoned] }
        heroMediaUrl: { type: string, nullable: true }
        languages:
          type: array
          items: { type: string }
        saved: { type: boolean }
    SpeciesDetail:
      allOf:
        - $ref: '#/components/schemas/SpeciesSummary'
        - type: object
          properties:
            id: { type: string, format: uuid }
            authorship: { type: string, nullable: true }
            rank: { type: string }
            gbifKey: { type: string, nullable: true }
            iucn:
              type: object
              nullable: true
              properties:
                category: { type: string, enum: [CR, EN, VU, NT, LC, DD, NE] }
                assessmentId: { type: string }
                redListVersion: { type: string }
                asOf: { type: string, format: date }
                label: { type: string }
            requestedLanguage: { type: string }
            resolvedLanguage: { type: string }
            fallback:
              type: object
              nullable: true
              properties:
                used: { type: boolean }
                reason: { type: string, enum: [missing, unpublished, stale, not_reviewed] }
                chip: { type: string, example: English }
            content:
              $ref: '#/components/schemas/SpeciesVariant'
            names:
              type: array
              items: { $ref: '#/components/schemas/SpeciesName' }
            media:
              type: array
              items: { $ref: '#/components/schemas/SpeciesMedia' }
            audio:
              type: array
              items: { $ref: '#/components/schemas/SpeciesAudio' }
            sources:
              type: array
              items: { $ref: '#/components/schemas/SpeciesSource' }
            whereToSee:
              type: array
              items: { $ref: '#/components/schemas/WhereToSee' }
            links:
              type: array
              items: { $ref: '#/components/schemas/SpeciesLink' }
            coverage:
              type: array
              items: { $ref: '#/components/schemas/LanguageCoverage' }
            contentVersion: { type: integer }
    SpeciesVariant:
      type: object
      required: [language, coverageTier, reviewStatus]
      properties:
        language: { type: string }
        coverageTier: { type: string, enum: [full, summary, names, audio] }
        summary: { type: string, nullable: true }
        description: { type: string, nullable: true }
        habitat: { type: string, nullable: true }
        range: { type: string, nullable: true }
        whereToSee: { type: string, nullable: true }
        conservation: { type: string, nullable: true }
        fieldStatus:
          type: object
          additionalProperties:
            type: string
            enum: [missing, draft, reviewed, stale]
        reviewStatus: { type: string, enum: [missing, draft, reviewed, stale] }
        sourceVersion: { type: integer }
        staleReason: { type: string, nullable: true }
        translatorRef: { type: string, nullable: true }
        reviewerRef: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
    SpeciesVariantWrite:
      type: object
      required: [language, coverageTier]
      properties:
        language: { type: string }
        coverageTier: { type: string, enum: [full, summary, names, audio] }
        summary: { type: string }
        description: { type: string }
        habitat: { type: string }
        range: { type: string }
        whereToSee: { type: string }
        conservation: { type: string }
        fieldStatus: { type: object, additionalProperties: { type: string } }
        sourceVersion: { type: integer }
        translatorRef: { type: string }
    SpeciesNameWrite:
      type: object
      required: [language, name]
      properties:
        language: { type: string }
        script: { type: string, default: Latn }
        name: { type: string }
        nameType: { type: string, enum: [common, local, scientific, alternate] }
        region: { type: string }
        countyGid: { type: integer, nullable: true }
        sourceId: { type: string, format: uuid, nullable: true }
        preferred: { type: boolean }
    SpeciesMediaWrite:
      type: object
      required: [mediaKind, storageKey, credit, rightsHolder, licenceCode]
      properties:
        mediaKind: { type: string, enum: [image, video, map] }
        storageKey: { type: string }
        width: { type: integer }
        height: { type: integer }
        rightsId: { type: string, format: uuid, nullable: true }
        credit: { type: string }
        rightsHolder: { type: string }
        licenceCode: { type: string }
        licenceUrl: { type: string }
        sensitiveLocation: { type: boolean }
        alt:
          type: object
          additionalProperties: { type: string }
    SpeciesAudioWrite:
      type: object
      required: [language, storageKey, narrator, transcript, durationSeconds]
      properties:
        language: { type: string }
        storageKey: { type: string }
        narrator: { type: string }
        transcript: { type: string }
        durationSeconds: { type: integer, minimum: 1 }
        rightsId: { type: string, format: uuid, nullable: true }
    SpeciesName:
      type: object
      required: [language, name, reviewStatus]
      properties:
        language: { type: string }
        script: { type: string }
        name: { type: string }
        nameType: { type: string, enum: [common, local, scientific, alternate] }
        region: { type: string, nullable: true }
        countyGid: { type: integer, nullable: true }
        reviewStatus: { type: string, enum: [missing, draft, reviewed, stale] }
        preferred: { type: boolean }
        source:
          allOf: [{ $ref: '#/components/schemas/SpeciesSource' }]
          nullable: true
    SpeciesMedia:
      type: object
      required: [id, mediaKind, url, credit, rightsHolder, licenceCode]
      properties:
        id: { type: string, format: uuid }
        mediaKind: { type: string, enum: [image, video, map] }
        url: { type: string }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        credit: { type: string }
        rightsHolder: { type: string }
        licenceCode: { type: string }
        licenceUrl: { type: string, nullable: true }
        sensitiveLocation: { type: boolean }
        alt:
          type: object
          additionalProperties: { type: string }
    SpeciesAudio:
      type: object
      required: [language, url, narrator, transcript, durationSeconds]
      properties:
        language: { type: string }
        url: { type: string }
        narrator: { type: string }
        transcript: { type: string }
        durationSeconds: { type: integer }
        reviewStatus: { type: string, enum: [missing, draft, reviewed, stale] }
        rights:
          allOf: [{ $ref: '#/components/schemas/SpeciesRights' }]
          nullable: true
    SpeciesSource:
      type: object
      required: [id, publisher, citation, licenceCode, permittedUse, attribution]
      properties:
        id: { type: string, format: uuid }
        publisher: { type: string }
        citation: { type: string }
        url: { type: string, nullable: true }
        accessedAt: { type: string, format: date }
        licenceCode: { type: string }
        licenceUrl: { type: string, nullable: true }
        permittedUse: { type: string, enum: [taxonomy_only, occurrence, prose, media, audio, link_only] }
        attribution: { type: string }
        snapshotHash: { type: string, nullable: true }
        reviewStatus: { type: string, enum: [missing, draft, reviewed, stale] }
    SpeciesSourceWrite:
      type: object
      required: [publisher, citation, accessedAt, licenceCode, permittedUse, attribution]
      properties:
        speciesId: { type: string, format: uuid, nullable: true }
        publisher: { type: string }
        citation: { type: string }
        url: { type: string }
        accessedAt: { type: string, format: date }
        licenceCode: { type: string }
        licenceUrl: { type: string }
        permittedUse: { type: string, enum: [taxonomy_only, occurrence, prose, media, audio, link_only] }
        attribution: { type: string }
        snapshotHash: { type: string }
    SpeciesRights:
      type: object
      required: [id, subjectType, subjectId, rightsHolder, licenceCode, permittedUse, attribution]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [media, audio] }
        subjectId: { type: string, format: uuid }
        rightsHolder: { type: string }
        licenceCode: { type: string }
        licenceUrl: { type: string, nullable: true }
        permittedUse: { type: string }
        attribution: { type: string }
        consentRecord: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
    SpeciesRightsWrite:
      type: object
      required: [subjectType, subjectId, rightsHolder, licenceCode, permittedUse, attribution]
      properties:
        subjectType: { type: string, enum: [media, audio] }
        subjectId: { type: string, format: uuid }
        rightsHolder: { type: string }
        licenceCode: { type: string }
        licenceUrl: { type: string }
        permittedUse: { type: string }
        attribution: { type: string }
        consentRecord: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
    WhereToSee:
      type: object
      required: [evidenceType, confidence]
      properties:
        destinationSlug: { type: string, nullable: true }
        countyGid: { type: integer, nullable: true }
        county: { type: string, nullable: true }
        protectedArea: { type: string, nullable: true }
        evidenceType: { type: string, enum: [survey, occurrence_record, expert_observation, published_report] }
        confidence: { type: string, enum: [low, medium, high] }
        reviewStatus: { type: string, enum: [missing, draft, reviewed, stale] }
        copy: { type: string, example: Recorded at Nairobi National Park }
        source:
          allOf: [{ $ref: '#/components/schemas/SpeciesSource' }]
          nullable: true
    SpeciesLink:
      type: object
      required: [targetType, targetId, title]
      properties:
        targetType: { type: string, enum: [destination, course, audio_story, event] }
        targetId: { type: string }
        title: { type: string }
        href: { type: string }
    LanguageCoverage:
      type: object
      required: [language, tier, available]
      properties:
        language: { type: string }
        name: { type: string }
        tier: { type: string, enum: [full, summary, names, audio] }
        available: { type: boolean }
        reviewedNames: { type: integer }
        audio: { type: boolean }
        fallback: { type: boolean }
    SpeciesWrite:
      type: object
      required: [scientificName]
      properties:
        scientificName: { type: string }
        slug: { type: string }
        authorship: { type: string }
        taxonomicRank: { type: string }
        taxonomicStatus: { type: string, enum: [accepted, synonym, provisional, uncertain] }
        acceptedSpeciesId: { type: string, format: uuid, nullable: true }
        gbifKey: { type: string }
        iucnTaxonId: { type: string }
        wikidataQid: { type: string }
        iucnCategory: { type: string, enum: [CR, EN, VU, NT, LC, DD, NE] }
        iucnAssessmentId: { type: string }
        redListVersion: { type: string }
        statusAsOf: { type: string, format: date }
    SpeciesReviewItem:
      type: object
      required: [id, entityType, entityId, stage, status]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, enum: [species, name, content, media, audio, where_to_see] }
        entityId: { type: string, format: uuid }
        speciesSlug: { type: string }
        language: { type: string, nullable: true }
        stage: { type: string, enum: [translation, language, expert, rights, publish] }
        status: { type: string, enum: [pending, approved, changes_requested, rejected] }
        assignedTo: { type: string, nullable: true }
        translatorRef: { type: string, nullable: true }
        reviewerRef: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
    SpeciesPack:
      type: object
      required: [language, version, sizeBytes, entries]
      properties:
        language: { type: string }
        version: { type: string }
        sizeBytes: { type: integer }
        generatedAt: { type: string, format: date-time }
        entries:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              contentVersion: { type: integer }
              hasAudio: { type: boolean }

    # -----------------------------------------------------------------------
    # Analytics
    # -----------------------------------------------------------------------
    AnalyticsInstallRequest:
      type: object
      required: [installId, platform]
      properties:
        installId: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        osVersion: { type: string }
        appVersion: { type: string }
        build: { type: string }
        locale: { type: string }
        actorType: { type: string, enum: [guest, account] }
    AnalyticsIdentity:
      type: object
      required: [analyticsId, installId, actorType, consent]
      properties:
        analyticsId: { type: string, format: uuid }
        installId: { type: string, format: uuid }
        actorType: { type: string, enum: [guest, account, under_18_private] }
        consent: { $ref: '#/components/schemas/AnalyticsConsent' }
    AnalyticsConsent:
      type: object
      required: [analyticsId, scope, version, state]
      properties:
        analyticsId: { type: string, format: uuid }
        scope: { type: string, enum: [analytics] }
        version: { type: string }
        state: { type: string, enum: [unknown, granted, denied] }
        recordedAt: { type: string, format: date-time }
    AnalyticsConsentWrite:
      type: object
      required: [analyticsId, version, state, source]
      properties:
        analyticsId: { type: string, format: uuid }
        version: { type: string }
        state: { type: string, enum: [granted, denied] }
        source: { type: string, enum: [guest_device, account] }
    AnalyticsEvent:
      type: object
      required: [eventId, sessionId, sessionSeq, family, name, clientTs]
      properties:
        eventId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        sessionSeq: { type: integer, minimum: 1 }
        family: { type: string, enum: [screen_view, action, journey_step] }
        name: { type: string, description: 'Template route for screen_view, verb for action, reserved journey_step' }
        route: { type: string, nullable: true, description: Template route only; never a resolved URL or query string }
        clientTs: { type: string, format: date-time }
        properties:
          type: object
          additionalProperties: true
          description: Allow-listed per event; unknown keys are dropped and counted
    AnalyticsBatch:
      type: object
      required: [analyticsId, installId, consentVersion, appVersion, platform, sessionId, events]
      properties:
        analyticsId: { type: string, format: uuid }
        installId: { type: string, format: uuid }
        consentVersion: { type: string }
        appVersion: { type: string }
        build: { type: string }
        platform: { type: string, enum: [ios, android] }
        osVersion: { type: string }
        locale: { type: string }
        tzOffsetMin: { type: integer, minimum: -840, maximum: 840 }
        network: { type: string, enum: [wifi, cellular, none, unknown] }
        actorType: { type: string, enum: [guest, account, under_18_private] }
        sessionId: { type: string, format: uuid }
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AnalyticsEvent' }
    AnalyticsBatchAck:
      type: object
      required: [batchId, accepted, dropped, unknownKeys]
      properties:
        batchId: { type: string, format: uuid }
        accepted: { type: integer }
        dropped: { type: integer }
        unknownKeys: { type: integer }
        rejectedEventIds:
          type: array
          items: { type: string, format: uuid }
    MetricCell:
      type: object
      required: [metric, value, suppressed]
      properties:
        metric: { type: string }
        value: { type: number, nullable: true }
        unit: { type: string, enum: [count, percent, ratio, currency] }
        suppressed: { type: boolean }
        definition: { type: string }
        caveat: { type: string, nullable: true }
    AnalyticsOverview:
      type: object
      required: [from, to, cells]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        cells:
          type: array
          items: { $ref: '#/components/schemas/MetricCell' }
        daily:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              dau: { type: integer, nullable: true }
              guests: { type: integer, nullable: true }
              accounts: { type: integer, nullable: true }
              suppressed: { type: boolean }
    JourneyStepMetric:
      type: object
      required: [journey, step, stepIndex, reached, suppressed]
      properties:
        journey: { type: string, enum: [onboarding, first_itinerary, event_registration, challenge_submission, conservation_checkin, course_completion, heritage_visit, audio_playback, recognition_optin] }
        step: { type: string }
        stepIndex: { type: integer }
        reached: { type: integer, nullable: true }
        dropped: { type: integer, nullable: true }
        medianDurationBucket: { type: string, nullable: true }
        suppressed: { type: boolean }
    FunnelMetric:
      type: object
      required: [journey, entered, completed, suppressed]
      properties:
        journey: { type: string }
        entered: { type: integer, nullable: true }
        completed: { type: integer, nullable: true }
        conversion: { type: number, nullable: true }
        suppressed: { type: boolean }
    RetentionMetric:
      type: object
      required: [cohortWeek, weekIndex, actors, retained, suppressed]
      properties:
        cohortWeek: { type: string, format: date }
        weekIndex: { type: integer }
        actors: { type: integer, nullable: true }
        retained: { type: integer, nullable: true }
        rate: { type: number, nullable: true }
        suppressed: { type: boolean }
    AdoptionMetric:
      type: object
      required: [feature, reach, suppressed]
      properties:
        feature: { type: string }
        reach: { type: integer, nullable: true }
        depthPerActor: { type: number, nullable: true }
        repeatRate: { type: number, nullable: true }
        suppressed: { type: boolean }
    DataQuality:
      type: object
      required: [from, to, ingest, suppression]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        ingest:
          type: object
          properties:
            events: { type: integer }
            batches: { type: integer }
            droppedEvents: { type: integer }
            unknownKeys: { type: integer }
            rejectedBatches: { type: integer }
        consent:
          type: object
          properties:
            granted: { type: integer }
            denied: { type: integer }
            unknown: { type: integer }
            staleVersion: { type: integer }
        queue:
          type: object
          properties:
            clientDrops: { type: integer }
            expired: { type: integer }
        suppression:
          type: object
          properties:
            threshold: { type: integer, example: 10 }
            cellsSuppressed: { type: integer }
        rollups:
          type: array
          items:
            type: object
            properties:
              rollup: { type: string }
              lastDay: { type: string, format: date }
              status: { type: string, enum: [running, ok, failed] }
    AnalyticsExport:
      type: object
      required: [analyticsId, generatedAt, events, sessions]
      properties:
        analyticsId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsEvent' }
        sessions:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string, format: uuid }
              startedAt: { type: string, format: date-time }
              endedAt: { type: string, format: date-time, nullable: true }
              eventCount: { type: integer }
    ErasureRequest:
      type: object
      required: [id, subjectType, status, requestedAt, targetBy]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [user, analytics_id] }
        status: { type: string, enum: [pending, in_progress, completed, failed] }
        requestedAt: { type: string, format: date-time }
        targetBy: { type: string, format: date-time }
        backupCycleUntil: { type: string, format: date-time, nullable: true }

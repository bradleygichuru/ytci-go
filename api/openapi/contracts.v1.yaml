openapi: 3.0.3
info:
  title: YTC Explorer execution contracts
  version: 1.0.0
  description: |
    Frozen interface for the four execution streams (MICE, recognition, species,
    analytics) plus the platform contract endpoints. This is a contract gate,
    not a claim that the handlers are implemented.

    Conventions:
    - All authenticated routes use `Authorization: Bearer <token>`.
    - Guests may call `/v1/public/*`. Account routes live under `/v1/mobile/*`
      and require auth; `/v1/mobile/*` read routes also work without auth where
      the contract marks `security: []`.
    - Errors use `{ "error": { "code", "message" } }`; validation failures use
      `{ "errors": [ { "field", "message" } ] }`.
    - Cursor pagination uses `limit` and `cursor`; responses use
      `items`, `nextCursor`, `hasMore`.
    - Timestamps are RFC 3339 in `Africa/Nairobi` unless a `timezone` field says
      otherwise.
    - Breaking changes require the change-control ticket described in
      docs/execution/contracts.md.
servers:
  - url: https://ytci-go.onrender.com
    description: production
  - url: http://localhost:8099
    description: contracts mock server
tags:
  - name: mice
    description: Events, venues, sessions, registration, tickets, check-in
  - name: recognition
    description: Rules, XP, badges, missions, seasons, leaderboard
  - name: species
    description: Species catalogue, languages, sources, rights
  - name: analytics
    description: Pseudonymous product analytics and rollups
  - name: platform
    description: Contract versions and shared metadata
security:
  - bearerAuth: []
paths:
  # -------------------------------------------------------------------------
  # MICE — public
  # -------------------------------------------------------------------------
  /v1/public/events:
    get:
      tags: [mice]
      operationId: listPublicEvents
      summary: Published events visible to guests
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EventClass'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/CountyGid'
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: from
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/EventSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/public/events/{id}:
    get:
      tags: [mice]
      operationId: getPublicEvent
      summary: Event detail with agenda, venue, accessibility and registration state
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/public/events/{id}/calendar.ics:
    get:
      tags: [mice]
      operationId: getPublicEventCalendar
      summary: RFC 5545 VEVENT with VALARM
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: alarm_minutes
          in: query
          schema: { type: integer, enum: [60, 1440, 10080] }
      responses:
        '200':
          description: ICS calendar
          content:
            text/calendar:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/public/organizers/{slug}:
    get:
      tags: [mice]
      operationId: getPublicOrganizer
      summary: Organizer page with trust tier and published events
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
      responses:
        '200':
          description: Organizer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizerProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/public/venues/{slug}:
    get:
      tags: [mice]
      operationId: getPublicVenue
      summary: Venue sheet with dated accessibility provenance
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
      responses:
        '200':
          description: Venue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------------------
  # MICE — account
  # -------------------------------------------------------------------------
  /v1/mobile/events/{id}/registrations:
    post:
      tags: [mice]
      operationId: createEventRegistration
      summary: Register for a free or registered event (RSVP)
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '201':
          description: Registration created, waitlisted or handoff recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Capacity, duplicate registration, or registration closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/mobile/events/{id}/ticket-handoffs:
    post:
      tags: [mice]
      operationId: recordEventTicketHandoff
      summary: Record interest in a paid event and open the organizer's ticket URL
      description: |
        Records handoff interest only. It does not create a confirmed
        registration, issue a ticket, or count toward capacity (ADR 0011 §2).
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                priceAcknowledged: { type: boolean, default: true }
      responses:
        '201':
          description: Handoff recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketHandoff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Event is not a ticket-handoff event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/mobile/events/{id}/registration:
    get:
      tags: [mice]
      operationId: getMyEventRegistration
      summary: The reader's registration, ticket and check-in state
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [mice]
      operationId: cancelMyEventRegistration
      summary: Cancel a confirmed registration and trigger FIFO waitlist promotion
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Cancelled registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Event already started, already checked in, or not cancellable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/mobile/registrations:
    get:
      tags: [mice]
      operationId: listMyEventRegistrations
      summary: Registrations for the reader's ticket wallet
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          schema: { type: string, enum: [upcoming, past, all], default: upcoming }
      responses:
        '200':
          description: Registration page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/mobile/events/{id}/ticket:
    get:
      tags: [mice]
      operationId: getEventTicket
      summary: Signed, short-TTL QR ticket for a confirmed registration
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: No confirmed registration, or check-in is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mobile/events/{id}/checkins:
    post:
      tags: [mice]
      operationId: checkInEventAttendee
      summary: Staff check-in by QR token or manual name lookup
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInRequest' }
      responses:
        '201':
          description: Check-in recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckIn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Actor is not assigned staff for this organizer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Duplicate scan; the existing check-in is returned in `details`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/mobile/events/{id}/checkin-scans:
    post:
      tags: [mice]
      operationId: syncOfflineCheckInScans
      summary: Batch-sync the offline scanner queue (first write wins)
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInScanBatch' }
      responses:
        '200':
          description: Per-scan resolution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInScanBatchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/mobile/events/{id}/reports:
    post:
      tags: [mice]
      operationId: reportEvent
      summary: Report an event or organizer; never creates an Alert
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventReportRequest' }
      responses:
        '202':
          description: Report accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/mobile/events/{id}/notifications:
    get:
      tags: [mice]
      operationId: listEventNotifications
      summary: Durable Events filter for Alerts & updates
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/EventNotification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/mobile/events/{id}/reminder:
    put:
      tags: [mice]
      operationId: setEventReminder
      summary: Set or clear the opt-in reminder offset
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offsetMinutes]
              properties:
                offsetMinutes:
                  type: integer
                  nullable: true
                  enum: [60, 1440, 10080]
      responses:
        '200':
          description: Registration with the updated reminder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------------------------
  # MICE — admin
  # -------------------------------------------------------------------------
  /v1/admin/venues:
    get:
      tags: [mice]
      operationId: adminListVenues
      summary: Venue admin list
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CountyGid'
      responses:
        '200':
          description: Venue page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Venue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [mice]
      operationId: adminCreateVenue
      summary: Create a curated venue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueWrite' }
      responses:
        '201':
          description: Venue created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/venues/{id}:
    patch:
      tags: [mice]
      operationId: adminUpdateVenue
      summary: Update a venue and its accessibility report
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueWrite' }
      responses:
        '200':
          description: Venue updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/organizers:
    get:
      tags: [mice]
      operationId: adminListOrganizers
      summary: Organizer verification queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unverified, pending, verified, expired, revoked]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Organizer page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrganizerProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [mice]
      operationId: adminCreateOrganizer
      summary: Create an organizer profile draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizerWrite' }
      responses:
        '201':
          description: Organizer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizerProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/organizers/{id}:
    patch:
      tags: [mice]
      operationId: adminUpdateOrganizer
      summary: Update organizer profile, trust tier or expiry
      parameters:
        - $ref: '#/components/parameters/OrganizerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizerWrite' }
      responses:
        '200':
          description: Organizer updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizerProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/organizers/{id}/verification:
    post:
      tags: [mice]
      operationId: adminDecideOrganizerVerification
      summary: Verify, reject, revoke, restore or expire an organizer
      description: |
        Requires the `organizer.verify` permission. The actor must differ from
        the organizer requester; every decision writes an append-only
        organizer_verification_event and an audit row.
      parameters:
        - $ref: '#/components/parameters/OrganizerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizerVerificationDecision' }
      responses:
        '200':
          description: Organizer with the new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizerProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Reviewer is the requester, or the transition is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/admin/events:
    get:
      tags: [mice]
      operationId: adminListEvents
      summary: Event review queue and event admin list
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, postponed, cancelled, scheduled]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/EventSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [mice]
      operationId: adminCreateEvent
      summary: Create an event draft for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWrite' }
      responses:
        '201':
          description: Draft event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/events/{id}:
    get:
      tags: [mice]
      operationId: adminGetEvent
      summary: Event admin detail including draft state
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [mice]
      operationId: adminUpdateEvent
      summary: Edit an event draft or submit a material change
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWrite' }
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Material edit requires review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/admin/events/{id}/sessions:
    post:
      tags: [mice]
      operationId: adminCreateEventSession
      summary: Add an agenda session
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '201':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/events/{id}/sessions/{sessionId}:
    patch:
      tags: [mice]
      operationId: adminUpdateEventSession
      summary: Update an agenda session
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/events/{id}/people:
    post:
      tags: [mice]
      operationId: adminCreateEventPerson
      summary: Create a speaker content record
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonWrite' }
      responses:
        '201':
          description: Speaker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Speaker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/sessions/{sessionId}/speakers:
    post:
      tags: [mice]
      operationId: adminLinkSessionSpeaker
      summary: Link a speaker to a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId: { type: string, format: uuid }
                role: { type: string, enum: [speaker, moderator, panelist, host] }
      responses:
        '200':
          description: Session with speakers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/mobile/events/{id}/save:
    post:
      tags: [mice]
      operationId: saveEvent
      summary: Save an event to the shortlist (not a registration)
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/mobile/events/saved:
    get:
      tags: [mice]
      operationId: listSavedEvents
      summary: Saved events
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/EventSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/admin/events/{id}/publish:
    post:
      tags: [mice]
      operationId: adminPublishEvent
      summary: Publish a reviewed event (programme partners after readiness checks)
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Published event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Readiness or organizer verification failed
          content:

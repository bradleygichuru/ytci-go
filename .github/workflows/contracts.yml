name: contracts

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./internal/... ./cmd/... ./fixtures/...
      # The full suite, not just the contract package: internal/mice,
      # internal/recognition, internal/species, internal/analytics and
      # internal/server carry the feature tests that gate the admin surfaces.
      - name: Tests (all packages)
        run: go test ./... -count=1
      - name: Migration replay on a fresh database
        run: go test ./internal/contracts -run TestMigrationsApplyOnFreshDatabase -count=1 -v

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/server ./cmd/server"
  bin = "bin/server"
  full_bin = "bin/server"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "testdata", "docs"]
  exclude_file = []
  exclude_regex = [".*_test.go"]
  exclude_unchanged = false
  log = "build-errors.log"
  override_dirs = []
  watch_dir = ["./cmd", "./internal"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = false

[color]
  build = "yellow"
  main = "green"

[misc]
  clean_on_exit = true
